version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r 03a/requirements.txt
      - run:
          name: Run unit tests
          command: python -m unittest discover -s 03a -v

workflows:
  main:
    jobs:
      - test